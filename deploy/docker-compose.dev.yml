# Surcouche de dev : image construite depuis les sources, base accessible en local, conteneur Rust jetable.
# S'utilise via scripts/dev.sh et scripts/cargo.sh.

services:
  chaudron:
    image: chaudron:dev
    build: ..
    pull_policy: build
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      PUBLIC_URL: http://localhost:${CHAUDRON_PORT:-28471}
      # Connexion factice (sans mot de passe) en plus des vrais fournisseurs s'ils sont dans .env.
      AUTH_FAKE: ${AUTH_FAKE:-1}
      # Appli servie par Expo (npm run dev, sur :8081) : DEV_WEB_ORIGIN=http://localhost:8081 scripts/dev.sh up -d
      # Vide : l'appli construite est servie par le serveur, sur :28471.
      DEV_WEB_ORIGIN: ${DEV_WEB_ORIGIN:-}

  db:
    ports: ["127.0.0.1:5432:5432"]

  toolbox:
    profiles: [tools]
    build: { context: .., target: toolchain }
    image: chaudron-toolbox:dev
    working_dir: /src
    env_file: .env
    environment:
      CARGO_TARGET_DIR: /target
    volumes:
      - ..:/src
      - cargo-registry:/usr/local/cargo/registry
      - cargo-target:/target
    depends_on:
      db: { condition: service_healthy }

volumes:
  cargo-registry:
  cargo-target:
