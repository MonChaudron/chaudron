# Chaudron auto-heberge. Installation : voir "Heberger Chaudron" dans le README.
#   mkdir -p data/pg              (certains Docker, sur NAS notamment, ne creent pas ce dossier)
#   cp .env.example .env          puis changer le mot de passe (aux deux endroits)
#   docker compose up -d          puis http://localhost:28471/health
# Fichier volontairement en ASCII : il survit a toutes les copies (Windows, NAS, editeurs).
name: mon-chaudron

services:
  chaudron:
    image: ghcr.io/monchaudron/chaudron:latest
    restart: unless-stopped
    ports: ["${CHAUDRON_PORT:-28471}:8080"]
    env_file: .env            # DATABASE_URL
    depends_on:
      db: { condition: service_healthy }
    mem_limit: 32m

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: .env            # POSTGRES_USER, POSTGRES_PASSWORD, POSTGRES_DB
    command: >
      postgres -c shared_buffers=16MB -c max_connections=10
               -c work_mem=2MB -c maintenance_work_mem=16MB
               -c effective_cache_size=64MB -c max_wal_size=64MB
    volumes: ["./data/pg:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
    mem_limit: 128m
