<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Icône d'appli Chaudron, « ça bouillonne » : le o, des bulles au fond qui remontent et s'échappent.
       Fond plein (pas d'arrondi) : le système du téléphone découpe lui-même la forme de l'icône. -->
  <rect width="64" height="64" fill="#C3E534"/>
  <g transform="translate(6.4 6.4) scale(0.8)">
    <circle cx="32" cy="38" r="15" fill="none" stroke="#1C2208" stroke-width="8"/>
    <circle cx="29" cy="43" r="3" fill="#1C2208"/>
    <circle cx="35.5" cy="37" r="2.2" fill="#1C2208"/>
    <circle cx="30.5" cy="32" r="1.6" fill="#1C2208"/>
    <circle cx="26" cy="14" r="4" fill="#1C2208"/>
    <circle cx="37" cy="9" r="3" fill="#1C2208"/>
  </g>
</svg>
