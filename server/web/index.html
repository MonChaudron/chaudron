<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chaudron</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif; }
    main { width: min(22rem, calc(100% - 2rem)); text-align: center; }
    a.button, button { display: block; margin: .6rem 0; padding: .8rem; border: 1px solid; border-radius: .5rem;
      font: inherit; color: inherit; background: none; text-decoration: none; cursor: pointer; width: 100%; box-sizing: border-box; }
    .error { color: #c62828; }
  </style>
</head>
<body>
  <main>
    <h1>Chaudron</h1>
    <p id="message"></p>
    <div id="actions"></div>
  </main>
  <script>
    // Page d'attente : connexion et invitations, en attendant l'appli (M1, PR suivante).
    const labels = { google: 'Se connecter avec Google', amazon: 'Se connecter avec Amazon', fake: 'Connexion factice (dev)' };
    const errors = {
      'refus': 'Connexion annulée.',
      'fournisseur': 'Le fournisseur de connexion a refusé ou ne répond pas. Réessaie.',
      'expiree': 'La connexion a pris trop de temps. Réessaie.',
      'inscriptions-fermees': 'Les inscriptions sont fermées : il faut un lien d’invitation.',
      'deja-lie': 'Ce compte est déjà lié à un autre compte Chaudron.',
      'interne': 'Erreur du serveur. Réessaie plus tard.',
    };
    const message = document.getElementById('message');
    const actions = document.getElementById('actions');
    const say = (text, error) => { message.textContent = text; message.className = error ? 'error' : ''; };
    const link = (text, href) => Object.assign(document.createElement('a'), { className: 'button', textContent: text, href });

    async function main() {
      const params = new URLSearchParams(location.search);
      const invite = location.pathname.match(/^\/invitation\/([\w-]+)$/)?.[1];
      const me = await fetch('/api/v1/me').then(r => r.ok ? r.json() : null);
      if (params.get('erreur')) say(errors[params.get('erreur')] ?? 'Connexion impossible.', true);

      if (invite) {
        const info = await fetch(`/api/v1/invites/${invite}`).then(r => r.ok ? r.json() : null);
        if (!info) return say('Ce lien d’invitation n’existe pas.', true);
        if (info.joined_household_id) say(`Tu fais partie du foyer « ${info.household_name} ».`);
        else if (info.status !== 'pending') return say('Ce lien d’invitation n’est plus valable : demande-en un nouveau.', true);
        else say(`${info.invited_by ?? 'Quelqu’un'} t’invite à rejoindre le foyer « ${info.household_name} ».`);
        if (me && !info.joined_household_id) {
          const join = Object.assign(document.createElement('button'), { textContent: 'Rejoindre le foyer' });
          join.onclick = async () => {
            const r = await fetch(`/api/v1/invites/${invite}/accept`, { method: 'POST' });
            r.ok ? location.assign('/') : say('Ce lien d’invitation n’est plus valable.', true);
          };
          return actions.append(join);
        }
      }

      if (me) {
        if (!invite && !params.get('erreur')) {
          const homes = me.households.map(h => h.name).join(', ');
          say(`Bonjour ${me.display_name}. ${homes ? `Foyer : ${homes}.` : 'Pas encore de foyer.'}`);
        }
        const post = (url, body) => fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body ?? null) });
        const home = me.households[0];
        if (!home && !invite) {
          const create = Object.assign(document.createElement('button'), { textContent: 'Créer mon foyer' });
          create.onclick = async () => {
            const name = prompt('Nom du foyer', 'Maison');
            if (name && (await post('/api/v1/households', { name })).ok) location.assign('/');
          };
          actions.append(create);
        } else if (home?.role === 'owner' && !invite) {
          const share = Object.assign(document.createElement('button'), { textContent: 'Inviter quelqu’un dans le foyer' });
          share.onclick = async () => {
            const r = await post(`/api/v1/households/${home.id}/invites`);
            if (!r.ok) return say('Invitation impossible.', true);
            const { url } = await r.json();
            say(`Lien à envoyer (valable 7 jours, une seule fois) : ${url}`);
            if (navigator.share) navigator.share({ title: 'Chaudron', text: `Rejoins le foyer « ${home.name} » sur Chaudron`, url }).catch(() => {});
          };
          actions.append(share);
        }
        const logout = Object.assign(document.createElement('button'), { textContent: 'Se déconnecter' });
        logout.onclick = () => fetch('/api/v1/auth/logout', { method: 'POST' }).then(() => location.assign('/'));
        return actions.append(logout);
      }

      const providers = await fetch('/api/v1/auth/providers').then(r => r.json());
      const query = invite ? `?invite=${invite}` : '';
      for (const p of providers) actions.append(link(labels[p] ?? p, `/api/v1/auth/${p}/login${query}`));
    }
    main().catch(() => say('Chaudron ne répond pas.', true));
  </script>
</body>
</html>
