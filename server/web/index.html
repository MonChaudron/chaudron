<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chaudron</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/fonts/unbounded-latin-wght.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/atkinson-hyperlegible-next-latin-wght.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/chaudron.css">
  <script>
    // Thème choisi sur cet appareil (sinon celui du téléphone), appliqué avant l'affichage.
    try { const t = localStorage.getItem('chaudron.theme'); if (t) document.documentElement.dataset.theme = t; } catch {}
  </script>
  <style>
    .page { max-width: 30rem; margin: 0 auto; padding: var(--space-5) var(--space-4) var(--space-7); display: flex; flex-direction: column; gap: var(--space-6); }
    .top { display: flex; align-items: center; justify-content: space-between; gap: var(--space-4); }
    .top .logo { font-size: 26px; }
    .top .button--quiet { width: auto; padding: 0 var(--space-3); font-size: 15px; }
    main { display: flex; flex-direction: column; gap: var(--space-6); }
    .card { display: flex; flex-direction: column; gap: var(--space-4); }
    .card > .tag { align-self: flex-start; }
    .actions { display: flex; flex-direction: column; gap: var(--space-3); }
    .hero { padding-top: var(--space-5); display: flex; justify-content: center; }
    .hero .logo { font-size: clamp(40px, 13vw, 56px); }
    .note { font-size: 15px; text-align: center; }
    .share { display: flex; gap: var(--space-2); }
    .share input { flex: 1; min-width: 0; }
    .share .button { width: auto; }
  </style>
</head>
<body>
  <div class="page">
    <header class="top">
      <a class="logo" href="/" aria-label="Chaudron, accueil">chaudr<svg class="logo-o" viewBox="13 6 38 51" aria-hidden="true"><circle cx="32" cy="38" r="15" fill="none" stroke="currentColor" stroke-width="8"/><circle cx="26" cy="14" r="4" fill="currentColor"/><circle cx="37" cy="9" r="3" fill="currentColor"/></svg>n</a>
      <button class="button button--quiet" id="theme" type="button"></button>
    </header>
    <main id="main" aria-live="polite"></main>
  </div>
  <script>
    // Page d'attente de M1 : connexion, invitation, création du foyer. L'appli complète arrive ensuite.
    const labels = { google: 'Se connecter avec Google', amazon: 'Se connecter avec Amazon', fake: 'Connexion factice (dev)' };
    const errors = {
      'refus': 'Connexion annulée.',
      'fournisseur': 'Le fournisseur de connexion a refusé ou ne répond pas. Réessaie.',
      'expiree': 'La connexion a pris trop de temps. Réessaie.',
      'inscriptions-fermees': 'Les inscriptions sont fermées : il faut un lien d’invitation.',
      'deja-lie': 'Ce compte est déjà lié à un autre compte Chaudron.',
      'interne': 'Erreur du serveur. Réessaie plus tard.',
    };
    const main = document.getElementById('main');

    // Petit constructeur d'éléments : el('p', { className: 'muted' }, 'texte', autreElement).
    const el = (tag, props = {}, ...children) => {
      const node = Object.assign(document.createElement(tag), props);
      node.append(...children.filter(c => c != null));
      return node;
    };
    const button = (text, onclick, kind = '') => el('button', { type: 'button', className: `button ${kind}`, textContent: text, onclick });
    const link = (text, href, kind = '') => el('a', { className: `button ${kind}`, textContent: text, href });
    const api = (url, method = 'GET', body) => fetch(url, body === undefined ? { method } : {
      method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body),
    });
    const show = (...nodes) => main.replaceChildren(el('section', { className: 'card' }, ...nodes));

    // Thème : automatique (comme le téléphone), jour, nuit.
    const themes = [[null, 'Thème : auto'], ['light', 'Thème : jour'], ['dark', 'Thème : nuit']];
    const themeButton = document.getElementById('theme');
    const paintTheme = () => {
      const current = document.documentElement.dataset.theme ?? null;
      themeButton.textContent = themes.find(([t]) => t === current)[1];
    };
    themeButton.onclick = () => {
      const current = document.documentElement.dataset.theme ?? null;
      const [next] = themes[(themes.findIndex(([t]) => t === current) + 1) % themes.length];
      if (next) document.documentElement.dataset.theme = next; else delete document.documentElement.dataset.theme;
      try { next ? localStorage.setItem('chaudron.theme', next) : localStorage.removeItem('chaudron.theme'); } catch {}
      paintTheme();
    };
    paintTheme();

    async function render() {
      const params = new URLSearchParams(location.search);
      const error = params.get('erreur') && el('p', { className: 'alert', textContent: errors[params.get('erreur')] ?? 'Connexion impossible.' });
      const invite = location.pathname.match(/^\/invitation\/([\w-]+)$/)?.[1];
      const me = await api('/api/v1/me').then(r => r.ok ? r.json() : null);
      const providers = me ? [] : await api('/api/v1/auth/providers').then(r => r.json());
      const logins = (query = '') => el('div', { className: 'actions' },
        ...providers.map(p => link(labels[p] ?? p, `/api/v1/auth/${p}/login${query}`)));

      if (invite) {
        const info = await api(`/api/v1/invites/${invite}`).then(r => r.ok ? r.json() : null);
        if (!info) return show(el('h1', { textContent: 'Lien inconnu' }), el('p', { className: 'muted', textContent: 'Ce lien d’invitation n’existe pas.' }));
        if (info.joined_household_id) {
          return show(el('span', { className: 'tag', textContent: 'Bienvenue' }),
            el('h1', { textContent: `Tu fais partie du foyer « ${info.household_name} »` }),
            el('div', { className: 'actions' }, link('Continuer', '/', 'button--primary')));
        }
        if (info.status !== 'pending') {
          return show(el('h1', { textContent: 'Lien expiré' }),
            el('p', { className: 'muted', textContent: `Ce lien n’est plus valable. Demande-en un nouveau à ${info.invited_by ?? 'la personne qui t’a invitée'}.` }));
        }
        return show(error, el('span', { className: 'tag', textContent: 'Invitation' }),
          el('h1', { textContent: `Rejoins le foyer « ${info.household_name} »` }),
          el('p', { className: 'muted', textContent: `${info.invited_by ?? 'Quelqu’un'} t’invite à partager les menus de la semaine, les recettes et la liste de courses.` }),
          me ? el('div', { className: 'actions' }, button('Rejoindre le foyer', async () => {
            const r = await api(`/api/v1/invites/${invite}/accept`, 'POST', null);
            r.ok ? location.assign('/') : render();
          }, 'button--primary')) : logins(`?invite=${invite}`),
          el('p', { className: 'note muted', textContent: 'Lien valable 7 jours, une seule fois.' }));
      }

      if (!me) {
        // Accueil : le grand logo remplace celui de l'en-tête.
        document.querySelector('.top .logo').style.visibility = 'hidden';
        main.replaceChildren(
          el('div', { className: 'hero' }, document.querySelector('.top .logo').cloneNode(true)),
          el('section', { className: 'card' }, error,
            el('h1', { textContent: 'Les menus de la maison' }),
            el('p', { className: 'muted', textContent: 'Recettes adaptées à ton matériel, menus de la semaine et liste de courses partagée.' }),
            logins()));
        return;
      }

      const logout = button('Se déconnecter', () => api('/api/v1/auth/logout', 'POST', null).then(() => location.assign('/')), 'button--quiet');
      const home = me.households[0];

      if (!home) {
        const name = el('input', { name: 'name', value: 'Maison', required: true, maxLength: 80, autocomplete: 'off' });
        const form = el('form', { className: 'actions', onsubmit: async (event) => {
          event.preventDefault();
          const r = await api('/api/v1/households', 'POST', { name: name.value });
          r.ok ? render() : form.prepend(el('p', { className: 'alert', textContent: 'Le nom doit faire entre 1 et 80 caractères.' }));
        } },
          el('label', { className: 'field' }, 'Nom du foyer', name),
          el('button', { type: 'submit', className: 'button button--primary', textContent: 'Créer mon foyer' }));
        return show(error, el('h1', { textContent: `Bonjour ${me.display_name}` }),
          el('p', { className: 'muted', textContent: 'Pas encore de foyer : crée le tien, puis invite ceux qui partagent ta cuisine.' }),
          form, logout);
      }

      const actions = el('div', { className: 'actions' });
      if (home.role === 'owner') {
        actions.append(button('Inviter quelqu’un', async () => {
          const r = await api(`/api/v1/households/${home.id}/invites`, 'POST', null);
          if (!r.ok) return actions.prepend(el('p', { className: 'alert', textContent: 'Invitation impossible. Réessaie.' }));
          const { url } = await r.json();
          const field = el('input', { value: url, readOnly: true, ariaLabel: 'Lien d’invitation', onfocus: e => e.target.select() });
          const copy = button('Copier', async () => { try { await navigator.clipboard.writeText(url); copy.textContent = 'Copié'; } catch { field.select(); } });
          actions.replaceChildren(
            el('p', { textContent: 'Envoie ce lien à la personne invitée. Il sert une seule fois, pendant 7 jours.' }),
            el('div', { className: 'share field' }, field, copy),
            navigator.share ? button('Partager…', () => navigator.share({ title: 'Chaudron', text: `Rejoins le foyer « ${home.name} » sur Chaudron`, url }).catch(() => {}), 'button--primary') : null);
        }, 'button--primary'));
      }
      show(error, el('span', { className: 'tag', textContent: home.role === 'owner' ? 'Propriétaire' : 'Membre' }),
        el('h1', { textContent: home.name }),
        el('p', { className: 'muted', textContent: `Bonjour ${me.display_name}. Les menus, les recettes et les courses arrivent très bientôt ici.` }),
        actions, logout);
    }
    render().catch(() => show(el('p', { className: 'alert', textContent: 'Chaudron ne répond pas.' })));
  </script>
</body>
</html>
